services:
  openfancontroller-remote:
    image: ghcr.io/void2412/openfancontroller-remote:latest
    environment:
      HOST: "0.0.0.0"
      PORT: "8088"
      CONTROLLER_POLL_INTERVAL: "2.0"
      CURVE_POLL_INTERVAL: "2.0"
      POWER_SWITCH_STATE_INTERVAL: "2.0"
      LOG_LEVEL: "info"
      CONFIG_PATH: "/app/runtime/fan_control_config.json"
    ports:
      - "8088:8088"
    volumes:
      - ./openfancontroller-data:/app/runtime
    restart: unless-stopped

    # On Linux, pass the OpenFanController serial device into the container.
    # Replace /dev/ttyACM0 with the stable device path for your controller.
    # devices:
    #   - "/dev/ttyACM0:/dev/ttyACM0"
